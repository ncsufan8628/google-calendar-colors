views:
  - type: sections
    max_columns: 10
    title: Family Calendar
    path: family-calendar
    sections:
      - type: custom:layout-card
        grid_options:
          columns: full
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: 1fr 2fr 2fr
          grid-template-areas: |
            "clock now forecast"
          column-gap: 12px
          width: 100%
        cards:
          - type: custom:better-moment-card
            view_layout:
              grid-area: clock
            parentStyle: |
              line-height:normal;
            moment:
              - parentStyle: |
                  font-size:1em; text-align:center; margin-top:5px;
                templateRaw: |
                  {{moment format=cccc}}
              - parentStyle: |
                  font-size:1.5em; text-align:center; margin-top:5px;
                templateRaw: |
                  {{moment format=LLLL dd, yyyy}}
              - parentStyle: |
                  font-size:4em; text-align:center; font-weight:400;
                templateRaw: |
                  {{moment format=hh:mm}}
            card_mod:
              style: >
                ha-card { background: transparent !important; box-shadow: none
                !important; border: none !important; }
          - type: custom:weather-card
            view_layout:
              grid-area: now
            entity: weather.home
            current: true
            details: true
            forecast: false
            card_mod:
              style: >
                ha-card { background: transparent !important; box-shadow: none
                !important; border: none !important; }
          - type: weather-forecast
            view_layout:
              grid-area: forecast
            show_current: false
            show_forecast: true
            entity: weather.home
            forecast_type: daily
            name: Weather Forecast
            card_mod:
              style: >
                ha-card { background: transparent !important; box-shadow: none
                !important; border: none !important; }
        column_span: 10
      - type: grid
        cards:
          - type: vertical-stack
            cards:
              - type: markdown
                content: " "
                card_mod:
                  style: >
                    ha-card { background: none; box-shadow: none; border: none;
                    }
                grid_options:
                  columns: 18
                  rows: auto
            grid_options:
              columns: 120
              rows: auto
          - type: vertical-stack
            cards:
              - type: markdown
                content: <font color="Black" size="6">Family Calendar</font>
                grid_options:
                  columns: 18
                  rows: auto
            grid_options:
              columns: 120
              rows: auto
          - type: horizontal-stack
            cards:
              - type: custom:bubble-card
                card_type: button
                button_type: state
                entity: person.person_one
                show_icon: true
                show_name: true
                button_action:
                  tap_action:
                    action: perform-action
                    perform_action: script.person_one_calendar_visible_filter
                tap_action:
                  action: perform-action
                  perform_action: script.person_one_calendar_visible_filter
                styles: |
                  .bubble-button-background {
                    opacity: 1 !important;
                    background-color: ${hass.states['input_text.person_one_calendar_filter'].state === '.*' ? 'light-grey' : '#ff7d69'} !important;
                  }
              - type: custom:bubble-card
                card_type: button
                button_type: state
                entity: person.person_two
                show_icon: true
                show_name: true
                button_action:
                  tap_action:
                    action: perform-action
                    perform_action: script.person_two_calendar_visible_filter
                tap_action:
                  action: perform-action
                  perform_action: script.person_two_calendar_visible_filter
                styles: |
                  .bubble-button-background {
                    opacity: 1 !important;
                    background-color: ${hass.states['input_text.person_two_calendar_filter'].state === '.*' ? 'light-grey' : '#fdbf6f'} !important;
                  }
              - type: custom:bubble-card
                card_type: button
                button_type: state
                entity: person.person_three
                show_icon: true
                show_name: true
                button_action:
                  tap_action:
                    action: perform-action
                    perform_action: script.person_three_calendar_visible_filter
                tap_action:
                  action: perform-action
                  perform_action: script.person_three_calendar_visible_filter
                styles: |
                  .bubble-button-background {
                    opacity: 1 !important;
                    background-color: ${hass.states['input_text.person_three_calendar_filter'].state === '.*' ? 'light-grey' : '#a6cee3'} !important;
                  }
              - type: custom:bubble-card
                card_type: button
                button_type: state
                entity: person.person_four
                show_icon: true
                show_name: true
                button_action:
                  tap_action:
                    action: perform-action
                    perform_action: script.person_four_calendar_visible_filter
                tap_action:
                  action: perform-action
                  perform_action: script.person_four_calendar_visible_filter
                styles: |
                  .bubble-button-background {
                    opacity: 1 !important;
                    background-color: ${hass.states['input_text.person_four_calendar_filter'].state === '.*' ? 'light-grey' : '#cab2d6'} !important;
                  }
              - type: custom:bubble-card
                card_type: button
                button_type: name
                name: Family
                icon: mdi:human-male-female-child
                show_icon: true
                show_name: true
                button_action:
                  tap_action:
                    action: perform-action
                    perform_action: script.family_calendar_visible_filter
                tap_action:
                  action: perform-action
                  perform_action: script.family_calendar_visible_filter
                styles: |
                  .bubble-button-background {
                    opacity: 1 !important;
                    background-color: ${hass.states['input_text.family_calendar_filter'].state === '.*' ? 'light-grey' : '#4A90E2'} !important;
                  }
                entity: input_boolean.family_calendar_show
              - type: custom:bubble-card
                card_type: button
                button_type: name
                name: Birthdays
                icon: mdi:cake-variant
                show_icon: true
                show_name: true
                button_action:
                  tap_action:
                    action: perform-action
                    perform_action: script.birthdays_calendar_visible_filter
                tap_action:
                  action: perform-action
                  perform_action: script.birthdays_calendar_visible_filter
                styles: |
                  .bubble-button-background {
                    opacity: 1 !important;
                    background-color: ${hass.states['input_text.birthdays_calendar_filter'].state === '.*' ? 'light-grey' : '#33a02c'} !important;
                  }
              - type: custom:bubble-card
                card_type: button
                button_type: name
                name: Holidays
                icon: mdi:bag-personal
                show_icon: true
                show_name: true
                button_action:
                  tap_action:
                    action: perform-action
                    perform_action: script.holidays_calendar_visible_filter
                tap_action:
                  action: perform-action
                  perform_action: script.holidays_calendar_visible_filter
                styles: |
                  .bubble-button-background {
                    opacity: 1 !important;
                    background-color: ${hass.states['input_text.holidays_calendar_filter'].state === '.*' ? 'light-grey' : '#ff7f00'} !important;
                  }
            grid_options:
              columns: 45
              rows: auto
          - type: markdown
            content: " "
            grid_options:
              columns: 3
              rows: auto
          - type: custom:bubble-card
            card_type: button
            button_type: name
            card_layout: large
            name: Add Event
            icon: mdi:calendar-plus
            button_action:
              tap_action:
                action: navigate
                navigation_path: '#addcalendarevent'
            tap_action:
              action: navigate
              navigation_path: '#addcalendarevent'
            styles: >
              * { font-size: 1.05em !important; }

              ha-card { --bubble-main-background-color: #393745 !important;
              width: 300px; }    

              .bubble-icon { --mdc-icon-size: 30px !important; color: snow
              !important; opacity: 1; }

              .bubble-icon-container { background: #393745 !important; display:
              flex; }

              .bubble-name { color: snow !important; opacity: 1; display: flex;
              line-height: 18px; flex-direction: row; justify-content: center;
              flex-grow: 1; margin: 0 40px 0 0; pointer-events: none; position:
              relative; overflow: hidden; }
            grid_options:
              columns: 10
              rows: 1
          - type: custom:bubble-card
            card_type: select
            entity: input_select.calendar_view
            show_name: true
            show_state: true
            name: Select View
            show_last_changed: false
            show_attribute: false
        column_span: 10
      - type: grid
        cards:
          - type: custom:config-template-card
            entities:
              - input_text.person_one_calendar_filter
              - input_text.person_two_calendar_filter
              - input_text.person_three_calendar_filter
              - input_text.person_four_calendar_filter
              - input_text.family_calendar_filter
              - input_text.holidays_calendar_filter
              - input_text.birthdays_calendar_filter
              - input_select.calendar_view
            variables:
              P1CAL: states['input_text.person_one_calendar_filter']?.state
              P2CAL: states['input_text.person_two_calendar_filter']?.state
              P3CAL: states['input_text.person_three_calendar_filter']?.state
              P4CAL: states['input_text.person_four_calendar_filter']?.state
              FAMCAL: states['input_text.family_calendar_filter']?.state
              HOLCAL: states['input_text.holidays_calendar_filter']?.state
              BIRCAL: states['input_text.birthdays_calendar_filter']?.state
              VIEW: states['input_select.calendar_view']?.state
              DAYS: |
                (() => {
                  const width = window.innerWidth;
                  const calendarView = states['input_select.calendar_view']?.state;
                  if (width >= 390 && width<= 500) return 1;
                  if (calendarView === 'Today') return 1;
                  if (calendarView === 'Tomorrow') return 2;
                  if (calendarView === 'Bimonth') return 56;
                  if (calendarView === 'Month') return 28;
                  if (calendarView === 'Biweek') return 14;
                  if (calendarView === 'Week') return 7;
                })()
            card:
              type: custom:week-planner-card
              calendars:
                - entity: calendar.person_one
                  name: Person One
                  color: '#ff7d69'
                  filter: ${ P1CAL }
                - entity: calendar.person_two
                  name: Person Two
                  color: '#fdbf6f'
                  filter: ${ P2CAL }
                - entity: calendar.person_three
                  name: Person Three
                  color: '#a6cee3'
                  filter: ${ P3CAL }
                - entity: calendar.person_four
                  name: Person Four
                  color: '#cab2d6'
                  filter: ${ P4CAL }
                - entity: calendar.family_calendar
                  name: Family
                  inherit_event_colors: true
                  filter: ${ FAMCAL }
                - entity: calendar.birthdays
                  name: Birthdays
                  color: '#33a02c'
                  filter: ${ BIRCAL }
                - entity: calendar.holidays
                  name: Holidays
                  color: '#ff7f00'
                  filter: ${ HOLCAL }
              days: ${ DAYS }
              showDescription: true
              timeFormat: h:mm
              startingDay: sunday
              startingDayOffset: 0
              hideWeekend: false
              noCardBackground: false
              compact: false
              weather:
                showCondition: true
                showTemperature: true
                showLowTemperature: true
                useTwiceDaily: false
                entity: weather.home
              locale: en
              showLocation: true
              hidePastEvents: false
              hideDaysWithoutEvents: false
              hideTodayWithoutEvents: false
              combineSimilarEvents: true
              showLegend: false
              legendToggle: false
              card_mod:
                style: |
                  ha-card {
                    background: rgba(255, 255, 255, 0.6) !important;
                    border-radius: 24px;
                    box-shadow: none;
                    .event.past { opacity: .2; background-color: gray !important; }
                    .time { color: #333333 !important; font-size: 0.8em !important; }
                    .event { color: #333333 !important; line-height: 16px !important; background-color: var(--border-color) !important; border-radius: 10px !important; max-height: 80px !important; overflow: hidden !important; font-size: 1.1em !important; }
                    .none { background-color: transparent !important; }
                    .today .number { border-radius: 5px; background-color: orange !important; padding-left: 4px; padding-right: 4px; }
                    .day .date .text { font-size: 1em !important; font-weight: bold !important; }
                    .day .date .number { font-weight: bold !important; font-size: 3em !important; }
                    .day { border: solid 1px whitesmoke; padding: 0.2%; width: 13% !important; }
                  }    
            grid_options:
              columns: 120
              rows: 1
              showDescription: false
        column_span: 10
      - type: grid
        cards:
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                hash: '#addcalendarevent'
                button_type: name
                name: Add Calendar Event
                icon: mdi:calendar-plus
                show_icon: true
                show_name: true
                open_action:
                  action: perform-action
                  perform_action: script.add
                styles: |
                  .bubble-button-card-container {
                    background: 
                    ${hass.states['input_select.calendar_select'].state == 'Person One' ? '#fb8072' 
                    : hass.states['input_select.calendar_select'].state == 'Person Two' ? '#fdbf6f' 
                    : hass.states['input_select.calendar_select'].state == 'Person Three' ? '#a6cee3' 
                    : hass.states['input_select.calendar_select'].state == 'Person Four' ? '#cab2d6' 
                    : hass.states['input_select.calendar_select'].state == 'Family' ? '#4A90E2' 
                    : 'gray'} !important;
                  }
              - type: vertical-stack
                cards:
                  - type: entities
                    entities:
                      - entity: input_select.calendar_select
                      - entity: input_text.calendar_event_title
                        name: Event Title
                      - entity: input_text.calendar_event_description
                        name: Event Description
                      - entity: input_boolean.calendar_all_day_event
                        name: All Day Event
                    title: Add Calendar Event
                    state_color: false
                  - type: conditional
                    conditions:
                      - entity: input_boolean.calendar_all_day_event
                        state: 'off'
                    card:
                      type: entities
                      entities:
                        - entity: input_datetime.calendar_event_start
                          name: Start Time
                        - entity: input_datetime.calendar_event_end
                          name: End Time
                  - type: conditional
                    conditions:
                      - entity: input_boolean.calendar_all_day_event
                        state: 'on'
                    card:
                      type: entities
                      entities:
                        - entity: input_datetime.calendar_day_event_start
                          name: Event Start Date
                        - entity: input_datetime.calendar_day_event_end
                          name: Event End Date
                  - type: custom:button-card
                    name: Add Event to Calendar
                    tap_action:
                      action: call-service
                      service: script.add_google_calendar_event
                    styles:
                      card:
                        - background-color: |
                            [[[
                              if (states['input_select.calendar_select'].state == 'Person One') return "#fb8072";
                              if (states['input_select.calendar_select'].state == 'Person Two') return "#fdbf6f";
                              if (states['input_select.calendar_select'].state == 'Person Three') return "#a6cee3";
                              if (states['input_select.calendar_select'].state == 'Person Four') return "#cab2d6";
                              if (states['input_select.calendar_select'].state == 'Family') return "#4A90E2";
                              return "gray";
                            ]]]                
    cards: []
    icon: mdi:calendar-blank-multiple
    background:
      opacity: 62
      alignment: center
      size: cover
      repeat: repeat
      attachment: fixed
      image: /local/your-background-image.jpg
